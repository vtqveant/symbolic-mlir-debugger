[tool.pytest.ini_options]
testpaths = ["debugger/tests", "dap_client/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [".git", ".venv", "node_modules", "__pycache__", ".pytest_cache", "generator", "runner"]
markers = [
    "slow: marks tests as slow",
    "parser: parser-related tests",
    "interpreter: interpreter-related tests",
    "dialect: dialect-specific tests",
    "integration: integration tests",
    "concolic: concolic execution tests",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist

  | node_modules/.*  # EXCLUDE node_modules
  | .*/__pycache__/.*
  | .*/\.pytest_cache/.*
)/
'''

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
