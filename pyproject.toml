[project]
name = "symbolic-mlir-debugger"
version = "0.1.0"
description = "Symbolic and concolic execution for MLIR with DAP and agent feedback"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "z3-solver>=4.12.0",
    "lark-parser>=0.12.0",
    "parse>=1.14.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0.1",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
smlir = "debugger.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["debugger*", "dap_client*", "dap_trace_library*"]
exclude = [
    "debugger.tests*",
    "dap_client.tests*",
    "dap_trace_library.tests*",
]

[tool.pytest.ini_options]
testpaths = ["debugger/tests", "dap_client/tests", "dap_trace_library/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [".git", ".venv", "node_modules", "__pycache__", ".pytest_cache", "generator", "runner"]
markers = [
    "slow: marks tests as slow",
    "parser: parser-related tests",
    "interpreter: interpreter-related tests",
    "dialect: dialect-specific tests",
    "integration: integration tests",
    "concolic: concolic execution tests",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist

  | node_modules/.*  # EXCLUDE node_modules
  | .*/__pycache__/.*
  | .*/\.pytest_cache/.*
)/
'''

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
