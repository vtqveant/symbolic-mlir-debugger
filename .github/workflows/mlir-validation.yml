# MLIR Syntax Validation GitHub Actions Workflow
# Save this file as: .github/workflows/mlir-validation.yml

name: MLIR Syntax Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.mlir'
      - '**/tests/*.py'
      - '.github/workflows/mlir-validation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.mlir'
      - '**/tests/*.py'
      - '.github/workflows/mlir-validation.yml'
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  validate-mlir:
    runs-on: ubuntu-latest
    name: Validate MLIR Syntax
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pytest
    
    - name: Run MLIR validation
      id: validation
      run: |
        # Run the validation script
        python scripts/validate_mlir_ci.py
    
    - name: Upload validation report
      if: failure() && steps.validation.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: mlir-validation-report
        path: mlir_validation_report.json
    
    - name: Comment on PR with validation results
      if: github.event_name == 'pull_request' && failure() && steps.validation.outcome == 'failure'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let report = 'MLIR validation failed. See workflow logs for details.';
          
          try {
            const data = fs.readFileSync('mlir_validation_report.json', 'utf8');
            const problems = JSON.parse(data);
            
            report = '## ❌ MLIR Syntax Validation Failed\n\n';
            report += 'The following MLIR syntax issues were found:\n\n';
            
            problems.forEach((problem, idx) => {
              report += `### ${problem.file}`;
              if (problem.line) {
                report += ` (line ${problem.line})`;
              }
              report += '\n\n';
              
              if (problem.error) {
                report += `**LSP Error:** ${problem.error}\n\n`;
              }
              
              if (problem.diagnostics && problem.diagnostics.length > 0) {
                report += '**Diagnostics:**\n';
                problem.diagnostics.forEach(diag => {
                  const line = diag.range ? diag.range.start.line + 1 : '?';
                  const char = diag.range ? diag.range.start.character + 1 : '?';
                  report += `- Line ${line}, Char ${char}: ${diag.message}\n`;
                });
                report += '\n';
              }
            });
            
            report += '---\n*This check ensures MLIR code follows correct syntax before running tests.*';
          } catch (error) {
            report += `\n\nCould not read validation report: ${error.message}`;
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: report
          });