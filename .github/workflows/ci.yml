name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-cov
    - name: Run tests
      run: |
        python -m pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install linting tools
      run: |
        pip install black flake8 requests
        echo "Python version: $(python --version)"
        echo "Black version: $(black --version)"
        echo "Python path: $(which python)"
    - name: Check formatting (our code only)
      run: |
        echo "Running black check..."
        black --check --verbose .
    - name: Lint with flake8 (our code only)
      run: |
        python -m flake8 . \
          --exclude=vscode,node_modules,.venv,venv,__pycache__,.pytest_cache \
          --max-line-length=100 --extend-ignore=E203,W503 --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Validate MLIR syntax with LSP server
      run: |
        echo "Validating MLIR syntax using LSP server..."
        python scripts/validate_mlir_ci.py
        echo "MLIR validation completed"
