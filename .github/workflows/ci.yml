name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-cov
    - name: Run tests
      run: |
        python -m pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install linting tools
      run: pip install black flake8
    - name: Check formatting (our code only)
      run: |
        find . -name "*.py" -type f \
          -not -path "*/vscode/*" \
          -not -path "*/node_modules/*" \
          -not -path "*/.venv/*" \
          -not -path "*/venv/*" \
          -not -path "*/__pycache__/*" \
          -not -path "*/.pytest_cache/*" \
          -exec python -m black --check {} +
    - name: Lint with flake8 (our code only)
      run: |
        python -m flake8 . \
          --exclude=vscode,node_modules,.venv,venv,__pycache__,.pytest_cache \
          --count --select=E9,F63,F7,F82 --show-source --statistics
