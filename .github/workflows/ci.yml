name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Run tests with coverage
        run: |
          python -m pytest -q \
            --cov=debugger.agent --cov=debugger.compiler \
            --cov=debugger.interpreter.safe_eval \
            --cov-report=term-missing --cov-fail-under=60

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lint tools
        run: pip install black flake8
      - name: Black check (agent/CLI and new adapters)
        run: |
          black --check \
            debugger/__init__.py debugger/__main__.py debugger/agent.py debugger/compiler.py \
            debugger/interpreter/safe_eval.py \
            debugger/tests/test_agent_api.py debugger/tests/test_compiler.py debugger/tests/test_safe_eval.py \
            dap_client/tests/test_session_inspection.py \
            dap_trace_library/execution/trace_executor.py dap_trace_library/tests
      - name: Flake8 (syntax/error checks)
        run: |
          flake8 \
            debugger/__init__.py debugger/__main__.py debugger/agent.py debugger/compiler.py \
            debugger/interpreter/safe_eval.py \
            debugger/tests/test_agent_api.py debugger/tests/test_compiler.py debugger/tests/test_safe_eval.py \
            dap_client/tests/test_session_inspection.py \
            dap_trace_library/execution/trace_executor.py dap_trace_library/tests \
            --max-line-length=100 --extend-ignore=E203,W503 --select=E9,F63,F7,F82

  mlir-validation:
    runs-on: ubuntu-latest
    name: MLIR validation (local, hermetic)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate MLIR with local tooling when available
        run: python scripts/mlir_validation/validate_mlir_ci.py
